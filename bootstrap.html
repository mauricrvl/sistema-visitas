<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear administrador inicial</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor">
    <div class="encabezado">
        <h1>⚙️ Administrador inicial</h1>
        <p>Usá esta página una sola vez. Después eliminá <strong>bootstrap.html</strong> del repositorio.</p>
    </div>
    <div class="aviso">
        <p>La función también exige el secreto <strong>BOOTSTRAP_SECRET</strong> configurado en Supabase.</p>
    </div>
    <div id="mensajes"></div>
    <form id="bootstrap-form" autocomplete="off">
        <label for="secret">Secreto de bootstrap:</label>
        <input id="secret" required type="password">
        <label for="usuario">Usuario inicial:</label>
        <input id="usuario" required maxlength="50" value="admin">
        <label for="password">Contraseña inicial:</label>
        <input id="password" required minlength="6" type="password">
        <button type="submit">Crear administrador</button>
    </form>
    <div class="botones-navegacion"><a href="index.html" class="boton-navegacion">⬅ Volver</a></div>
</div>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
document.querySelector('#bootstrap-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage();
    const button = e.target.querySelector('button');
    button.disabled = true;
    try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/admin-bootstrap`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                secret: document.querySelector('#secret').value,
                usuario: document.querySelector('#usuario').value,
                password: document.querySelector('#password').value
            })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'No se pudo crear el administrador.');
        showMessage('exito', 'Administrador creado. Ya podés entrar desde login.html. Eliminá bootstrap.html del repositorio.');
    } catch (error) {
        showMessage('error', error.message);
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
