<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrador</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor">
    <div class="encabezado">
        <h1>🔐 Acceso administrador</h1>
        <p>Ingrese sus datos para acceder al panel de administración.</p>
    </div>
    <div id="mensajes"></div>
    <form id="login-form" autocomplete="off">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required maxlength="50" placeholder="Ingrese su usuario" autocomplete="username">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña" autocomplete="current-password">
        <button type="submit">🔐 Iniciar sesión</button>
    </form>
    <div class="separador-opciones"><span>o</span></div>
    <a href="invitado.html" class="opcion-acceso opcion-invitado">
        <span class="opcion-icono">👤</span>
        <strong>Continuar como invitado</strong>
        <small>Consultar un DNI sin acceder al panel administrativo.</small>
    </a>
    <div class="botones-navegacion">
        <a href="index.html" class="boton-navegacion">⬅ Volver</a>
    </div>
</div>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>initLogin();</script>
</body>
</html>
