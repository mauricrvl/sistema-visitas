<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administradores</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="contenedor grande">
    <h1>👤 Administradores</h1>
    <div id="mensajes"></div>

    <h2>Agregar nuevo administrador</h2>
    <form id="crear-admin-form" autocomplete="off">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required maxlength="50" placeholder="Ingrese un usuario">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="Ingrese una contraseña">
        <label for="password2">Repetir contraseña:</label>
        <input type="password" id="password2" name="password2" required minlength="6" placeholder="Repita la contraseña">
        <button type="submit">➕ Agregar administrador</button>
    </form>

    <hr>

    <h2>Administradores existentes</h2>
    <div class="tabla-contenedor">
        <table>
            <thead><tr><th>Usuario</th><th>Acción</th></tr></thead>
            <tbody id="tabla-admins"></tbody>
        </table>
    </div>

    <div class="botones-navegacion">
        <a href="panel.html" class="boton-navegacion">👤 Volver al panel</a>
        <a href="#" id="logout" class="boton-navegacion">🚪 Cerrar sesión</a>
    </div>
</div>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>initAdministradores();</script>
</body>
</html>
